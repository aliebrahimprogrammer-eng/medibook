# Local environment variables
spring.config.import=optional:file:../.env[.properties]

# Test database
spring.datasource.url=jdbc:postgresql://localhost:5432/medibook_test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File storage
file.upload-dir=target/test-uploads


jwt-expiration-ms=86400000
jwt-secret=bWVkaWJvb2stdGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==

# Test-only internal service authentication
internal.api-key=test-internal-api-key

# Disable Kafka publishing in the test profile
app.kafka.notifications.enabled=false