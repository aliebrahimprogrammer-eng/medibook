server.port=8081

# Local environment variables
spring.config.import=optional:file:../.env[.properties]

# Development database
spring.datasource.url=jdbc:postgresql://localhost:5432/medibook
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configure the public URL
app.public-base-url=${USER_SERVICE_PUBLIC_URL:http://localhost:8081}

# JWT configuration
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

# Kafka producer configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Shared profile-picture storage (relative to user-service)
file.upload-dir=../uploads/profile-pictures

# Internal service authentication
internal.api-key=${USER_SERVICE_INTERNAL_API_KEY}
