
events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8081;
    }

    upstream business_service {
        server business-service:8082;
    }

    upstream notification_service {
        server notification-service:8083;
    }

    server {
        listen 80;
        server_name _;

        # =========================
        # COMMON PROXY SETTINGS
        # =========================

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;

        # =========================
        # HEALTH CHECK
        # =========================

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "MediBook API Gateway is running\n";
        }

        # =========================
        # USER SERVICE
        # =========================

        location /api/auth {
            proxy_pass http://user_service;
        }

        location /api/profile {
            proxy_pass http://user_service;
        }

        location /api/admin/users {
            proxy_pass http://user_service;
        }

        # User Service audit logs
        # Public:  /api/user-audit-logs
        # Backend: /api/audit-logs

        location = /api/user-audit-logs {
            proxy_pass http://user_service/api/audit-logs;
        }

        location ^~ /api/user-audit-logs/ {
            rewrite ^/api/user-audit-logs/(.*)$ /api/audit-logs/$1 break;
            proxy_pass http://user_service;
        }

        # =========================
        # BUSINESS SERVICE
        # =========================

        location /api/appointments {
            proxy_pass http://business_service;
        }

        location /api/waitlist {
            proxy_pass http://business_service;
        }

        location /api/availabilities {
            proxy_pass http://business_service;
        }

        location /api/doctors {
            proxy_pass http://business_service;
        }

        location /api/specializations {
            proxy_pass http://business_service;
        }

        # Business Service audit logs
        # Public:  /api/business-audit-logs
        # Backend: /api/audit-logs

        location = /api/business-audit-logs {
            proxy_pass http://business_service/api/audit-logs;
        }

        location ^~ /api/business-audit-logs/ {
            rewrite ^/api/business-audit-logs/(.*)$ /api/audit-logs/$1 break;
            proxy_pass http://business_service;
        }

        # =========================
        # NOTIFICATION SERVICE
        # =========================

        location /api/notifications {
            proxy_pass http://notification_service;

            # Server-Sent Events (SSE)
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Accel-Buffering no;
        }

        # =========================
        # UNKNOWN ROUTES
        # =========================

        location / {
            return 404;
        }
    }
}
