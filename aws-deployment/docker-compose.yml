services:
  user-service:
    image: 798645002363.dkr.ecr.eu-north-1.amazonaws.com/medibook-user-service:27
    container_name: medibook-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SERVER_PORT: 8081
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      USER_SERVICE_PUBLIC_URL: ${USER_SERVICE_PUBLIC_URL}
      USER_SERVICE_INTERNAL_API_KEY: ${USER_SERVICE_INTERNAL_API_KEY}
      FILE_UPLOAD_DIR: /uploads/profile-pictures
    volumes:
      - profile_uploads:/uploads
    expose:
      - "8081"
    mem_limit: 512m

  business-service:
    image: 798645002363.dkr.ecr.eu-north-1.amazonaws.com/medibook-business-service:27
    container_name: medibook-business-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SERVER_PORT: 8082
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      USER_SERVICE_BASE_URL: http://user-service:8081
      USER_SERVICE_INTERNAL_API_KEY: ${USER_SERVICE_INTERNAL_API_KEY}
    expose:
      - "8082"
    depends_on:
      - user-service
    mem_limit: 512m

  notification-service:
    image: 798645002363.dkr.ecr.eu-north-1.amazonaws.com/medibook-notification-service:27
    container_name: medibook-notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      SERVER_PORT: 8083
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    expose:
      - "8083"
    mem_limit: 512m

volumes:
  profile_uploads:
